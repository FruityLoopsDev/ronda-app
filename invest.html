<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>RONDA — Acceso Confidencial</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#100d13;color:#f3ede2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,440px);padding:32px;border:1px solid #70502a;border-radius:20px;background:#1b1420;box-shadow:0 24px 80px #0008}
    h1{font-size:24px;margin:0 0 8px}p{color:#c7bdc9;line-height:1.55;font-size:14px}
    label{display:block;margin:24px 0 8px;font-size:12px;color:#d8c9b0}
    input{width:100%;padding:14px;border:1px solid #514357;border-radius:10px;background:#100d13;color:#fff;font:inherit}
    button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:#efa92f;color:#21170b;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#status{min-height:22px;margin-top:14px;color:#f2b3a4;font-size:13px}
    .brand{letter-spacing:.22em;font-size:11px;color:#e5ae50;margin-bottom:20px}
  </style>
</head>
<body>
  <main>
    <div class="brand">RONDA · PISTA PRIVADA FFF</div>
    <h1>Acceso confidencial</h1>
    <p>Este espacio está restringido a invitados autorizados. Introduce tu credencial nominal para continuar.</p>
    <form id="access-form">
      <label for="invite-token">Token de invitación</label>
      <input id="invite-token" type="password" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required maxlength="68" placeholder="Introduce tu token privado">
      <button id="submit" type="submit">Verificar acceso seguro</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <p>¿Necesitas una invitación? <a href="https://wa.me/573026543854" rel="noopener noreferrer" style="color:#e5ae50">Contacta al equipo RONDA</a>.</p>
  </main>
  <script>
    (() => {
      const API = 'https://ronda-api.vercel.app/api/invest-access';
      const form = document.getElementById('access-form');
      const input = document.getElementById('invite-token');
      const button = document.getElementById('submit');
      const status = document.getElementById('status');
      const params = new URLSearchParams(location.search);
      const supplied = params.get('token') || '';
      if (supplied) {
        history.replaceState(null, '', location.pathname);
        input.value = supplied;
      }
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const token = input.value.trim();
        if (!/^rnd-[a-f0-9]{64}$/.test(token)) {
          status.textContent = 'Credencial no válida. Solicita una invitación vigente al equipo.';
          return;
        }
        button.disabled = true;
        input.value = '';
        status.textContent = 'Verificando credencial…';
        try {
          const response = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'omit',
            cache: 'no-store',
            referrerPolicy: 'no-referrer',
            body: JSON.stringify({ token })
          });
          if (!response.ok) throw new Error('access-denied');
          const protectedDocument = await response.text();
          if (!protectedDocument.startsWith('<!doctype html>') && !protectedDocument.startsWith('<!DOCTYPE html>')) {
            throw new Error('invalid-response');
          }
          document.open();
          document.write(protectedDocument);
          document.close();
        } catch (_) {
          status.textContent = 'No fue posible autorizar el acceso. Verifica tu invitación o solicita asistencia.';
          button.disabled = false;
        }
      });
      if (supplied) form.requestSubmit();
    })();
  </script>
</body>
</html>
