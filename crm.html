<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- BLINDAJE SEO PARA HERRAMIENTA INTERNA -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#16101B">
  
  <title>RONDA — CRM de Ventas & Embajadores</title>
  <link rel="icon" type="image/svg+xml" href="/assets/ronda-logo-amber.svg">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ronda.uno/crm">
  <meta property="og:title" content="RONDA CRM — Embajadores y Scouts">
  <meta property="og:description" content="Pipeline de ventas B2B, comisiones por hitos y afiliación de gastrobares.">
  <meta property="og:site_name" content="RONDA">
  <meta property="og:locale" content="es_CO">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/assets/ronda-tokens.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/crm.css">
</head>
<body class="dark-theme">

  <!-- VISTA 1: LOGIN EXCLUSIVO PARA VENTAS Y SCOUTS (Hidratado por portal-auth.ts) -->
  <section id="view-auth" class="panel on" aria-label="Autenticación del Portal Comercial"></section>

  <!-- VISTA 2: TABLERO KANBAN DE GESTIÓN COMERCIAL -->
  <section id="view-crm" class="panel" aria-label="Consola CRM de Ventas B2B">
    <main class="crm-shell-container">
      
      <!-- Encabezado y Métricas Rápidas (3 cifras de la política v5.1) -->
      <div class="crm-header-row">
        <div class="crm-title-group">
          <h1>Pipeline de Sedes</h1>
          <p class="crm-title-sub">
            <span id="crm-bounty-policy-label">Gestión de afiliación B2B · Bounty: $450.000 COP en 3 hitos ($100k / $250k / $100k).</span>
            <span id="crm-sync-badge" class="crm-sync-badge online" aria-live="polite">🟢 En línea · Sincronizado</span>
          </p>
        </div>

        <div class="crm-kpi-strip" role="region" aria-label="Resumen económico de comisiones">
          <div class="crm-kpi-pill">
            <span class="crm-kpi-label">Proyectado</span>
            <b id="crm-comm-projected" class="crm-kpi-val" aria-live="polite">$0 COP</b>
          </div>
          <div class="crm-kpi-pill accrued">
            <span class="crm-kpi-label">Devengado (Hitos)</span>
            <b id="crm-commissions" class="crm-kpi-val" aria-live="polite">$0 COP</b>
          </div>
          <div class="crm-kpi-pill paid">
            <span class="crm-kpi-label">Pagado</span>
            <b id="crm-comm-paid" class="crm-kpi-val" aria-live="polite">$0 COP</b>
          </div>
          <button type="button" id="btn-crm-add-lead-btn" class="btn ambar" style="font-size: 12.5px; font-weight: 700; padding: 11px 20px;">
            ➕ Registrar Nuevo Lead
          </button>
        </div>
      </div>

      <!-- Vista Prioritaria: Hoy & Vencidos (P1-12) -->
      <section id="crm-today-strip" class="crm-today-strip" aria-label="Acciones prioritarias para hoy" style="display: none;"></section>

      <!-- Barra de Herramientas (Búsqueda, Alcance, Zona, Día, Orden y CSV) -->
      <div class="crm-toolbar" role="search" aria-label="Filtros del pipeline comercial">
        <select id="crm-scope-filter" aria-label="Alcance del equipo" style="display: none;">
          <option value="all">👥 Todo el equipo</option>
          <option value="mine">👤 Mis leads</option>
        </select>

        <input type="search" id="crm-search-input" aria-label="Buscar por nombre del bar, zona, notas o contacto" placeholder="🔍 Buscar por nombre del bar, zona, notas o contacto...">

        <select id="crm-zone-filter" aria-label="Filtrar por zona de Bogotá">
          <option value="all">🌍 Todas las Zonas de Bogotá</option>
          <option value="Chapinero Alto">📍 Chapinero Alto</option>
          <option value="Quinta Camacho">📍 Quinta Camacho</option>
          <option value="Zona G">📍 Zona G</option>
          <option value="Zona T / El Retiro">📍 Zona T / El Retiro</option>
          <option value="Usaquén">📍 Usaquén</option>
          <option value="Parque 93">📍 Parque 93</option>
          <option value="Teusaquillo">📍 Teusaquillo</option>
        </select>

        <select id="crm-day-filter" aria-label="Filtrar por día preferido">
          <option value="all">📅 Todos los días</option>
          <option value="martes">Martes</option>
          <option value="miércoles">Miércoles</option>
          <option value="jueves">Jueves</option>
        </select>

        <select id="crm-sort-select" aria-label="Ordenar tarjetas del pipeline">
          <option value="next_action">⚡ Orden: Próxima acción</option>
          <option value="recent">🕒 Orden: Más recientes</option>
          <option value="accrued">💰 Orden: Mayor devengado</option>
          <option value="name">🔤 Orden: Nombre (A-Z)</option>
        </select>

        <button type="button" id="btn-crm-export-csv" class="btn" style="font-size: 11.5px; padding: 8px 12px; background: rgba(243,237,226,0.05); border-color: var(--linea);" title="Exportar pipeline actual a CSV">
          📥 Exportar CSV
        </button>

        <span class="crm-toolbar-hint" id="crm-filter-count" aria-live="polite">Cargando pipeline…</span>
      </div>

      <!-- Banner de error de suscripción / permisos (P2-21) -->
      <div id="crm-error-banner" role="alert" style="display: none; margin-bottom: 18px;"></div>

      <!-- Tablero Kanban de 3 Columnas -->
      <div class="kanban-wrapper" id="crm-kanban-wrapper">
        
        <!-- Columna 1: LEAD (Prospección Inicial) -->
        <div class="kanban-column col-lead" role="region" aria-label="Columna 1: Lead Nuevo">
          <div class="kanban-col-header">
            <b class="kanban-col-title">📥 1. Lead Nuevo</b>
            <span class="chip gris" id="crm-count-lead" style="font-size: 10px; font-weight: 700;">Prospecto</span>
          </div>
          <div id="kanban-lead" class="kanban-list" data-status="lead">
            <!-- Inyección desde TypeScript -->
          </div>
        </div>

        <!-- Columna 2: NEGOCIACIÓN (Gestión de Condiciones) -->
        <div class="kanban-column col-negotiating" role="region" aria-label="Columna 2: En Negociación">
          <div class="kanban-col-header" style="border-bottom-color: rgba(240,168,48,0.3);">
            <b class="kanban-col-title">🤝 2. Negociación</b>
            <span class="chip ambar" id="crm-count-negotiating" style="font-size: 10px; font-weight: 700;">En Curso</span>
          </div>
          <div id="kanban-negotiating" class="kanban-list" data-status="negotiating">
            <!-- Inyección desde TypeScript -->
          </div>
        </div>

        <!-- Columna 3: FIRMADO (Local Activo en Red) -->
        <div class="kanban-column col-signed" role="region" aria-label="Columna 3: Local Firmado">
          <div class="kanban-col-header" style="border-bottom-color: rgba(46,107,84,0.35);">
            <b class="kanban-col-title">🍾 3. Local Firmado</b>
            <span class="chip verde" id="crm-count-signed" style="font-size: 10px; font-weight: 700;">Ganado</span>
          </div>
          <div id="kanban-signed" class="kanban-list" data-status="signed">
            <!-- Inyección desde TypeScript -->
          </div>
        </div>

      </div>

      <!-- Drawer Accesible: Ficha Técnica del Local, Próxima Acción e Historial -->
      <div id="crm-lead-drawer-overlay" class="crm-drawer-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="crm-drawer-title">
        <div id="crm-lead-drawer" class="crm-drawer">
          <!-- Montado Dinámicamente por crm.ts -->
        </div>
      </div>

    </main>
  </section>

  <!-- Footer global (Desacoplado) -->
  <div id="footer-root"></div>

  <!-- Controlador Específico CRM -->
  <script type="module" src="/src/entry-crm.ts"></script>
</body>
</html>
