# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Historial completo de Git para métricas auditables (commits, días y horas)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_IS_DEMO: 'false'
          # QR de cobro Nequi (reemplaza la llave Wompi sandbox):
          # VITE_NEQUI_QR_URL: 'https://.../nequi-qr.png'  # o usa public/nequi-qr.png
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RONDA_UNO }}
          channelId: live
          projectId: ronda-uno
      # NOTA: rules y functions se despliegan manualmente (auth ADC de
      # firebase-tools es inestable desde runners GH, issue #10716):
      #   firebase deploy --only firestore:rules --project ronda-uno
      #   firebase deploy --only functions   --project ronda-uno  (requiere Blaze)
