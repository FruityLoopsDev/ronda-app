<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#16101B">
  <title>RONDA — Consola de Anfitrión & Control de Sala</title>
  <link rel="icon" type="image/svg+xml" href="/assets/ronda-logo-amber.svg">
  <meta name="description" content="Consola operativa de anfitrión para gestión de check-in, rotación de mesas y cronómetro en vivo en sedes aliadas de RONDA.">
  
  <!-- Open Graph / WhatsApp / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ronda.uno/admin">
  <meta property="og:title" content="RONDA — Consola de Anfitrión">
  <meta property="og:description" content="Gestión y control de salas de citas rápidas en vivo para sedes aliadas.">
  <meta property="og:image" content="https://ronda.uno/assets/og-ronda-main.jpg">
  <meta property="og:site_name" content="RONDA">
  <meta property="og:locale" content="es_CO">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/assets/ronda-tokens.css">
  <link rel="stylesheet" href="/css/styles.css">

  <style>
    .ronda-input {
      margin-bottom: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--linea); 
      background: rgba(243,237,226,.06); color: var(--papel); outline: none; 
      font-family: 'Space Grotesk', sans-serif; width: 100%; box-sizing: border-box; font-size: 14px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .ronda-input:focus { border-color: var(--luz); background: rgba(243,237,226,.1); }

    @keyframes loginSuccess {
      0% { transform: scale(0.97); opacity: 0.8; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .login-anim { animation: loginSuccess 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Layout Container para Auth */
    .admin-auth-wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 20px 60px;
      box-sizing: border-box;
    }

    /* Header Consola */
    .top-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 14px 20px 18px;
      max-width: 1180px;
      margin: 0 auto 16px;
      border-bottom: 1px solid rgba(243, 237, 226, 0.08);
    }
    .live-city-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--luz);
      text-transform: uppercase;
    }
    .pulse-amber-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--luz); box-shadow: 0 0 8px var(--luz);
      animation: pulseLight 2s infinite ease-in-out;
    }
    @keyframes pulseLight {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px var(--luz); }
    }
    .top-header .logo { font-size: 30px; margin: 0; letter-spacing: 0.16em; line-height: 1; }
    .header-right { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }

    .auth-card {
      background: rgba(28, 19, 36, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(240, 168, 48, 0.22);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    /* Master Panel Switcher Bar */
    .master-panel-nav {
      position: sticky; top: 0; z-index: 9990;
      background: rgba(14, 9, 18, 0.94);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--linea);
      padding: 8px 14px; display: flex; align-items: center;
      justify-content: space-between; gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .master-panel-links { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .master-panel-links::-webkit-scrollbar { display: none; }
    .master-nav-btn {
      background: rgba(243, 237, 226, 0.05); border: 1px solid var(--linea);
      color: var(--humo); font-family: var(--font-mono); font-size: 11px;
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
      white-space: nowrap; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 5px;
    }
    .master-nav-btn:hover { border-color: var(--luz); color: var(--papel); background: rgba(240, 168, 48, 0.1); }
    .master-nav-btn.active {
      background: var(--luz); color: var(--tinta); border-color: var(--luz);
      font-weight: 700; box-shadow: 0 0 14px rgba(240, 168, 48, 0.4);
    }

    /* Modales & Toasts Operativos */
    .modal-overlay {
      background: rgba(10, 7, 14, 0.88); backdrop-filter: blur(8px);
      display: none; position: fixed; inset: 0; z-index: 1000;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    #toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 100000;
      display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
  </style>
</head>
<body class="dark-theme">

  <header class="top-header">
    <div class="header-left">
      <span class="live-city-tag"><i class="pulse-amber-dot"></i> CONSOLA HOST</span>
    </div>
    <div class="marca">
      <a href="/" class="text-decoration-none">
        <h1 class="logo">R<em>O</em>NDA</h1>
      </a>
    </div>
    <div class="header-right" id="user-menu">
      <span class="chip gris text-xs">SALA EN VIVO</span>
    </div>
  </header>

  <!-- Vista: Autenticación Directa del Anfitrión / Equipo -->
  <section id="view-auth" class="panel on">
    <div class="admin-auth-wrap">
      <div class="auth-card">
        <span class="badge luz mb-2 text-xs letter-spacing-14em-up">🔔 CONTROL DE SALA · BOGOTÁ</span>
        
        <!-- LOGIN PRINCIPAL VISIBLE POR DEFECTO PARA EL ANFITRIÓN -->
        <form id="login-form" class="acciones flex flex-column" onsubmit="event.preventDefault();">
          <h3 class="font-display text-xl color-paper mb-2">Consola de Anfitrión</h3>
          <p class="detalle mb-4 text-sm color-humo line-height-145">
            Ingresa con tus credenciales autorizadas para gestionar el check-in QR, el cronómetro de 6 minutos y la rotación de mesas.
          </p>
          <input type="email" id="login-email" placeholder="Correo de anfitrión / admin" class="ronda-input" required>
          <input type="password" id="login-password" placeholder="Contraseña" class="ronda-input" autocomplete="current-password" required>
          <button type="submit" id="btn-real-login" class="btn ambar mt-2 width-100">
            🔓 Abrir Consola de Sala
          </button>
        </form>


      </div>
    </div>
  </section>

  <!-- Vista: Consola del Anfitrión de Sala (Montaje dinámico vía src/host-admin.ts) -->
  <section id="view-admin" class="panel pa-8 text-center color-humo font-mono text-sm">

  <!-- Footer global hidratado desde src/footer.ts -->
  <div id="footer-root"></div>

  <script type="module" src="/src/entry-admin.ts"></script>
</body>
</html>
