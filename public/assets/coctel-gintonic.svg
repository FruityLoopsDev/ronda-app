<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" fill="none">
  <!-- Balloon Gin Glass (Gin Tonic Botánico) -->
  <defs>
    <linearGradient id="ginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 218, 220, 0.4)" />
      <stop offset="50%" stop-color="rgba(69, 123, 157, 0.5)" />
      <stop offset="100%" stop-color="rgba(29, 53, 87, 0.6)" />
    </linearGradient>
    <linearGradient id="ginGlassRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)" />
    </linearGradient>
    <filter id="ginGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="48" r="30" fill="#2a9d8f" opacity="0.25" filter="url(#ginGlow)" />

  <!-- Balloon Copa Bowl -->
  <path d="M22 26 Q18 68 50 78 Q82 68 78 26 Z" fill="rgba(255, 255, 255, 0.08)" stroke="url(#ginGlassRim)" stroke-width="1.8" />

  <!-- Liquid Fill -->
  <path d="M23 40 Q20 68 50 76 Q80 68 77 40 Q50 43 23 40 Z" fill="url(#ginGrad)" />

  <!-- Botanical Cucumber Ribbon & Juniper Berries -->
  <path d="M30 46 Q45 68 68 50 Q74 44 72 38" stroke="#52b788" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="45" cy="56" r="3.5" fill="#2d6a4f" />
  <circle cx="58" cy="62" r="3" fill="#1b4332" />
  <circle cx="36" cy="60" r="2.5" fill="#2d6a4f" />

  <!-- Effervescence Bubbles -->
  <circle cx="40" cy="50" r="1.5" fill="rgba(255,255,255,0.7)" />
  <circle cx="48" cy="44" r="1.2" fill="rgba(255,255,255,0.7)" />
  <circle cx="62" cy="52" r="1.5" fill="rgba(255,255,255,0.7)" />

  <!-- Stem & Base -->
  <line x1="50" y1="78" x2="50" y2="108" stroke="url(#ginGlassRim)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M30 110 Q50 106 70 110" stroke="url(#ginGlassRim)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Highlights -->
  <path d="M26 36 Q23 58 38 70" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <ellipse cx="50" cy="26" rx="28" ry="4" stroke="url(#ginGlassRim)" stroke-width="1.5" fill="none" />
</svg>
