<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" fill="none">
  <!-- Wine Goblet (Tinto de Verano Especiado) -->
  <defs>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="50%" stop-color="#480ca8" />
      <stop offset="100%" stop-color="#240046" />
    </linearGradient>
    <linearGradient id="wineGlassRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.6)" />
    </linearGradient>
    <filter id="wineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="45" r="28" fill="url(#wineGrad)" opacity="0.3" filter="url(#wineGlow)" />

  <!-- Goblet Bowl -->
  <path d="M26 25 Q24 60 50 78 Q76 60 74 25 Z" fill="rgba(255, 255, 255, 0.08)" stroke="url(#wineGlassRim)" stroke-width="1.8" />

  <!-- Liquid Fill -->
  <path d="M28 40 Q26 62 50 75 Q74 62 72 40 Q50 44 28 40 Z" fill="url(#wineGrad)" />

  <!-- Berries & Cinnamon Stick -->
  <circle cx="42" cy="44" r="5" fill="#590d22" stroke="rgba(255,255,255,0.3)" />
  <circle cx="56" cy="48" r="6" fill="#800f2f" stroke="rgba(255,255,255,0.3)" />
  <line x1="48" y1="15" x2="62" y2="55" stroke="#936639" stroke-width="4" stroke-linecap="round" />

  <!-- Stem & Base -->
  <line x1="50" y1="78" x2="50" y2="108" stroke="url(#wineGlassRim)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M32 110 Q50 106 68 110" stroke="url(#wineGlassRim)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Highlights -->
  <path d="M32 35 Q30 55 45 70" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <ellipse cx="50" cy="25" rx="24" ry="3.5" stroke="url(#wineGlassRim)" stroke-width="1.5" fill="none" />
</svg>
