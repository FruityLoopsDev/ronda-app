<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&amp;display=swap');
      .bg { fill: #0E0E10; }
      .brand {
        font-family: 'Bodoni Moda', Didot, Georgia, serif;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: 14px;
        fill: #F3EDE2;
        text-anchor: middle;
      }
      .brand-o {
        fill: #F0A830;
        font-style: italic;
        font-weight: 500;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 8px;
        fill: #F0A830;
        text-anchor: middle;
        text-transform: uppercase;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 2px;
        fill: #8D8A94;
        text-anchor: middle;
      }
      .placeholder-box {
        fill: #16161B;
        stroke: #2E2E38;
        stroke-width: 3;
        stroke-dasharray: 16 16;
        rx: 36;
      }
      .box-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 32px;
        font-weight: 500;
        fill: #5E5B66;
        text-anchor: middle;
      }
      .footer-main {
        font-family: 'Bodoni Moda', Didot, Georgia, serif;
        font-size: 38px;
        font-weight: 600;
        fill: #F3EDE2;
        text-anchor: middle;
      }
      .footer-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 6px;
        fill: #F0A830;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" class="bg" />

  <!-- Header Branding -->
  <text x="548" y="220" class="brand">R<tspan class="brand-o">O</tspan>NDA</text>
  <text x="540" y="300" class="title">REPORTE DE PANTALLA</text>
  <text x="540" y="350" class="subtitle">Semana 1 · El costo del scroll infinito</text>

  <!-- Dashed Box for Screenshot -->
  <rect x="120" y="440" width="840" height="1060" class="placeholder-box" />
  <circle cx="540" cy="920" r="50" fill="#22222B" />
  <path d="M540 895 L540 945 M515 920 L565 920" stroke="#8D8A94" stroke-width="4" stroke-linecap="round" />
  <text x="540" y="1030" class="box-label">Pega tu captura aquí</text>
  <text x="540" y="1075" class="subtitle">(Añade el tuyo / Tu turno)</text>

  <!-- Footer Hook -->
  <text x="540" y="1620" class="footer-main">¿Y a cuántas personas conociste de verdad?</text>
  <text x="540" y="1690" class="footer-sub">ronda.uno/estreno</text>
</svg>

