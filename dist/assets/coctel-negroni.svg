<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" fill="none">
  <!-- Old Fashioned Rocks Glass (Negroni Ahumado) -->
  <defs>
    <linearGradient id="negroniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="60%" stop-color="#9b2748" />
      <stop offset="100%" stop-color="#540b0e" />
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.6)" />
    </linearGradient>
    <linearGradient id="orangePeel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Cocktail Glow -->
  <circle cx="50" cy="70" r="30" fill="url(#negroniGrad)" opacity="0.3" filter="url(#glow)" />

  <!-- Glass Body -->
  <path d="M22 30 L28 100 Q50 106 72 100 L78 30 Z" fill="rgba(255, 255, 255, 0.08)" stroke="url(#glassRim)" stroke-width="2" />
  
  <!-- Thick Glass Base -->
  <path d="M26 95 L28 100 Q50 106 72 100 L74 95 Q50 99 26 95 Z" fill="rgba(255, 255, 255, 0.25)" />

  <!-- Liquid Fill -->
  <path d="M25 45 L27 94 Q50 100 73 94 L75 45 Q50 48 25 45 Z" fill="url(#negroniGrad)" />

  <!-- Ice Sphere -->
  <circle cx="50" cy="65" r="18" fill="rgba(255, 255, 255, 0.22)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" />
  <ellipse cx="44" cy="58" rx="6" ry="3" fill="rgba(255, 255, 255, 0.5)" transform="rotate(-20 44 58)" />

  <!-- Orange Peel Garnish -->
  <path d="M35 24 Q50 12 68 32 Q72 38 65 42 Q55 26 38 34 Z" fill="url(#orangePeel)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />
  
  <!-- Subtle Glass Highlights -->
  <path d="M30 42 L33 88" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" stroke-linecap="round" />
  <path d="M70 42 L68 88" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-linecap="round" />
  <ellipse cx="50" cy="30" rx="28" ry="4" stroke="url(#glassRim)" stroke-width="1.5" fill="none" />
</svg>
