<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RONDA - Speed Dating B2B2C</title>
  <link rel="stylesheet" href="/css/styles.css">
  
  <!-- Tailwind for fast prototyping (if necessary) or custom styles in styles.css -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->

  <!-- Firebase SDKs (Compat version for simplicity without bundlers, or Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    
    // To be configured in firebase-config.js
    window.firebaseModules = { initializeApp, getFirestore, getAuth };
  </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased overflow-hidden w-screen h-screen">

  <!-- Contenedor Principal (SPA) -->
  <div id="app-container" class="w-full h-full flex flex-col relative">
    
    <!-- Barra Superior / Navegación -->
    <header id="app-header" class="bg-purple-800 text-white p-4 shadow-md flex justify-between items-center z-10">
      <h1 class="text-xl font-bold tracking-wider">RONDA</h1>
      <nav id="role-nav" class="hidden space-x-4 text-sm font-medium">
        <button id="nav-client" class="hover:text-purple-300">Cliente</button>
        <button id="nav-admin" class="hover:text-purple-300">Anfitrión</button>
        <button id="nav-network" class="hover:text-purple-300">Red</button>
        <button id="nav-superadmin" class="hover:text-purple-300">Super Admin</button>
      </nav>
      <div id="user-menu" class="text-sm">
        <button id="btn-login" class="bg-purple-600 px-3 py-1 rounded hover:bg-purple-500">Ingresar</button>
      </div>
    </header>

    <!-- Vistas de la Aplicación -->
    <main id="main-content" class="flex-1 overflow-y-auto relative w-full h-full bg-gray-50">
      
      <!-- Vista: Login / Auth -->
      <section id="view-auth" class="view-section active flex items-center justify-center h-full">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-sm w-full text-center">
          <h2 class="text-2xl font-bold text-purple-800 mb-6">Bienvenido a Ronda</h2>
          <button id="btn-demo-login" class="w-full bg-blue-600 text-white py-2 rounded mb-4 hover:bg-blue-700">Entrar modo Demo (Cliente)</button>
          <button id="btn-demo-host" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Entrar modo Demo (Anfitrión)</button>
        </div>
      </section>

      <!-- Vista: Cliente -->
      <section id="view-client" class="view-section hidden p-4">
        <h2 class="text-xl font-bold mb-4">Panel de Cliente</h2>
        <div id="client-content">Cargando perfil...</div>
      </section>

      <!-- Vista: Anfitrión (Bar) -->
      <section id="view-admin" class="view-section hidden p-4">
        <h2 class="text-xl font-bold mb-4">Panel del Anfitrión</h2>
        <div id="admin-content">Cargando sala...</div>
      </section>

    </main>

  </div>

  <!-- Scripts del Proyecto -->
  <!-- CSS inline via JS / Tailwind o Stylesheet local -->
  <style>
    .view-section { display: none; }
    .view-section.active { display: block; }
    /* Para Tailwind classes si no cargamos CDN */
  </style>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
